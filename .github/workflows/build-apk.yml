name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "fix/viewer-v0.5.5", "feature/callsign-read-editor", "feature/ui-simplification", "feature/presets-ogd" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          test -n "$VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "OpenGD77CPS-Android-v${VERSION}-debug.apk"
          sha256sum "OpenGD77CPS-Android-v${VERSION}-debug.apk" > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenGD77CPS-Android-v${{ steps.version.outputs.name }}-debug
          path: |
            OpenGD77CPS-Android-v*-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/presets-ogd'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          OPTIONS=()
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            TAG="${TAG}-rc.1"
            OPTIONS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving its assets."
            exit 0
          fi
          gh release create "$TAG" "OpenGD77CPS-Android-v${VERSION}-debug.apk" SHA256SUMS.txt --target "$GITHUB_SHA" --title "OpenGD77 CPS Android $TAG" --notes "Debug APK. Version status and compatibility: see VERSIONING.md at this tag. SHA-256 is attached." "${OPTIONS[@]}"
